services:
  gridwise-ems:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GRIDWISE_DB_PATH: /data/gridwise.db
    volumes:
      - gridwise_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gridwise_data:
